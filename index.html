<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senlife Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .premium-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .rounded-card { border-radius: 24px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .banner-animate { animation: slide 15s linear infinite; }
        @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .active-tab { color: #16a34a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/javascript">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('home'); // home, categories, cart, about, product-detail, admin, category-items
            const [products, setProducts] = useState(JSON.parse(localStorage.getItem('senlife_products')) || []);
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('senlife_cart')) || []);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");

            // Data Persistence
            useEffect(() => {
                localStorage.setItem('senlife_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('senlife_cart', JSON.stringify(cart));
            }, [cart]);

            // Categories Data
            const categories = [
                { id: 1, name: "Ev əşyaları", icon: "Home" },
                { id: 2, name: "Geyim", icon: "Shirt" },
                { id: 3, name: "Büjiteriya", icon: "Gem" },
                { id: 4, name: "Saatlar", icon: "Watch" },
                { id: 5, name: "Zərif dadlar", icon: "Coffee" },
                { id: 6, name: "Ətirlər", icon: "Wind" },
                { id: 7, name: "Şam və gips", icon: "Flame" },
                { id: 8, name: "Keramika", icon: "Citrus" },
                { id: 9, name: "Portretlər", icon: "Image" },
                { id: 10, name: "Hədiyyələr", icon: "Gift" },
                { id: 11, name: "Uşaq dünyası", icon: "Baby" },
                { id: 12, name: "Digər", icon: "PlusCircle" }
            ];

            const banners = [
                "Əl işləri", "Premium məhsullar", "Hədiyyəlik qutular", "Endirimlər", "Bonuslar"
            ];

            // Functions
            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? {...item, qty: item.qty + 1} : item));
                } else {
                    setCart([...cart, {...product, qty: 1}]);
                }
                alert("Səbətə əlavə olundu!");
            };

            const sendWhatsApp = (p) => {
                const msg = `Salam, bu məhsulu sifariş etmək istəyirəm:\n📦 Məhsul adı: ${p.name}\n💰 Qiymət: ${p.price} AZN\n🔢 Kod: ${p.code}\n📝 Təsvir: ${p.desc}\n\nÇatdırılma məlumatı:\nAd:\nÜnvan:\nTelefon:`;
                window.open(`https://wa.me/994773526665?text=${encodeURIComponent(msg)}`);
            };

            const handleAdminLogin = () => {
                const pass = prompt("Admin parolu daxil edin:");
                if (pass === "20152021Sn/_/") {
                    setView('admin');
                } else {
                    alert("Yanlış parol!");
                }
            };

            // Components
            const Header = () => (
                <div className="sticky top-0 z-50 bg-white/80 backdrop-blur-md p-4 flex items-center gap-3 border-b border-gray-100">
                    <button onClick={handleAdminLogin} className="p-2 bg-gray-50 rounded-full">
                        <i data-lucide="menu" className="w-6 h-6 text-green-600"></i>
                    </button>
                    <div className="flex-1 relative">
                        <input 
                            type="text" 
                            placeholder="Məhsul, kod, açar söz..." 
                            className="w-full bg-gray-100 rounded-full py-2 px-10 outline-none text-sm"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                        />
                        <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>
            );

            const BottomNav = () => (
                <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 py-3 px-6 flex justify-between items-center z-50">
                    <button onClick={() => setView('home')} className={view === 'home' ? 'active-tab' : 'text-gray-400'}>
                        <i data-lucide="home"></i>
                    </button>
                    <button onClick={() => setView('categories')} className={view === 'categories' ? 'active-tab' : 'text-gray-400'}>
                        <i data-lucide="layout-grid"></i>
                    </button>
                    <button onClick={() => setView('cart')} className="relative text-gray-400">
                        <i data-lucide="shopping-cart" className={view === 'cart' ? 'active-tab' : ''}></i>
                        {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">{cart.length}</span>}
                    </button>
                    <button onClick={() => setView('about')} className={view === 'about' ? 'active-tab' : 'text-gray-400'}>
                        <i data-lucide="info"></i>
                    </button>
                </div>
            );

            // Views
            if (view === 'admin') {
                return (
                    <div className="p-6 pb-24">
                        <div className="flex items-center gap-4 mb-6">
                            <button onClick={() => setView('home')} className="p-2 bg-green-100 rounded-full"><i data-lucide="arrow-left" className="text-green-700"></i></button>
                            <h2 className="text-xl font-bold">Admin Panel</h2>
                        </div>
                        <form onSubmit={(e) => {
                            e.preventDefault();
                            const newP = {
                                id: Date.now(),
                                name: e.target.name.value,
                                price: e.target.price.value,
                                code: e.target.code.value,
                                category: e.target.cat.value,
                                desc: e.target.desc.value,
                                images: [e.target.img.value] // Mobil sadəliyi üçün URL və ya base64
                            };
                            setProducts([newP, ...products]);
                            alert("Məhsul əlavə edildi!");
                            setView('home');
                        }} className="space-y-4">
                            <input name="name" placeholder="Məhsul adı" className="w-full p-3 border rounded-xl" required />
                            <input name="price" placeholder="Qiyməti" className="w-full p-3 border rounded-xl" required />
                            <input name="code" placeholder="Kodu" className="w-full p-3 border rounded-xl" required />
                            <select name="cat" className="w-full p-3 border rounded-xl">
                                {categories.map(c => <option key={c.name}>{c.name}</option>)}
                            </select>
                            <textarea name="desc" placeholder="Təsviri" className="w-full p-3 border rounded-xl"></textarea>
                            <input name="img" placeholder="Şəkil URL (və ya Base64)" className="w-full p-3 border rounded-xl" />
                            <button type="submit" className="w-full bg-green-600 text-white p-4 rounded-xl font-bold">Məhsulu Yerləşdir</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen">
                    <Header />
                    
                    {view === 'home' && (
                        <div className="p-4 pb-24">
                            {/* Banners */}
                            <div className="flex gap-3 overflow-x-auto hide-scrollbar mb-8">
                                {banners.map((b, i) => (
                                    <div key={i} className="min-w-[280px] h-40 bg-green-600 rounded-card p-6 relative overflow-hidden flex-shrink-0 premium-shadow">
                                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-white/10 to-transparent"></div>
                                        <h3 className="absolute bottom-4 left-4 text-white font-bold text-lg">{b}</h3>
                                    </div>
                                ))}
                            </div>

                            {/* New Products */}
                            <h2 className="text-xl font-bold mb-4 px-2">Yeni məhsullar</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())).map(p => (
                                    <div key={p.id} className="bg-white rounded-card p-2 premium-shadow border border-gray-50">
                                        <div onClick={() => { setSelectedProduct(p); setView('product-detail'); }} className="h-40 bg-gray-100 rounded-2xl mb-3 overflow-hidden">
                                            <img src={p.images[0] || 'https://via.placeholder.com/150'} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="text-sm font-semibold truncate">{p.name}</h3>
                                        <p className="text-green-600 font-bold mb-3">{p.price} AZN</p>
                                        <div className="flex flex-col gap-2">
                                            <button onClick={() => sendWhatsApp(p)} className="bg-green-600 text-white text-[10px] py-2 rounded-lg font-bold flex items-center justify-center gap-1">
                                                <i data-lucide="send" className="w-3 h-3"></i> Sifariş
                                            </button>
                                            <button onClick={() => addToCart(p)} className="bg-gray-100 text-gray-800 text-[10px] py-2 rounded-lg font-bold">
                                                Səbətə at
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'categories' && (
                        <div className="p-6 grid grid-cols-3 gap-6 pb-24">
                            {categories.map(c => (
                                <div key={c.id} onClick={() => { setSelectedCategory(c.name); setView('category-items'); }} className="flex flex-col items-center gap-2">
                                    <div className="w-16 h-16 bg-green-50 rounded-2xl flex items-center justify-center text-green-600">
                                        <i data-lucide={c.icon.toLowerCase()}></i>
                                    </div>
                                    <span className="text-[10px] text-center font-medium">{c.name}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'category-items' && (
                         <div className="p-4 pb-24">
                            <div className="flex items-center gap-4 mb-6">
                                <button onClick={() => setView('categories')} className="p-2 bg-gray-100 rounded-full"><i data-lucide="arrow-left"></i></button>
                                <h2 className="text-xl font-bold">{selectedCategory}</h2>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                {products.filter(p => p.category === selectedCategory).map(p => (
                                     <div key={p.id} className="bg-white rounded-card p-2 premium-shadow border border-gray-50">
                                        <div onClick={() => { setSelectedProduct(p); setView('product-detail'); }} className="h-40 bg-gray-100 rounded-2xl mb-3 overflow-hidden">
                                            <img src={p.images[0] || 'https://via.placeholder.com/150'} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="text-sm font-semibold truncate">{p.name}</h3>
                                        <p className="text-green-600 font-bold mb-3">{p.price} AZN</p>
                                        <button onClick={() => sendWhatsApp(p)} className="w-full bg-green-600 text-white text-[12px] py-2 rounded-lg font-bold">Sifariş et</button>
                                    </div>
                                ))}
                            </div>
                         </div>
                    )}

                    {view === 'product-detail' && selectedProduct && (
                        <div className="pb-24">
                            <div className="relative h-96 bg-gray-100">
                                <img src={selectedProduct.images[0]} className="w-full h-full object-cover" />
                                <div className="absolute top-4 left-4 right-4 flex justify-between">
                                    <button onClick={() => setView('home')} className="p-3 bg-white/80 backdrop-blur rounded-full shadow-lg"><i data-lucide="arrow-left"></i></button>
                                    <button onClick={() => { navigator.share({title: 'Senlife', url: window.location.href}) }} className="p-3 bg-white/80 backdrop-blur rounded-full shadow-lg"><i data-lucide="share-2"></i></button>
                                </div>
                            </div>
                            <div className="p-6 bg-white -mt-8 rounded-t-[40px] relative z-10">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">{selectedProduct.name}</h1>
                                        <p className="text-gray-400 text-sm">Kod: {selectedProduct.code} | {selectedProduct.category}</p>
                                    </div>
                                    <div className="text-2xl font-bold text-green-600">{selectedProduct.price} AZN</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-2xl mb-8">
                                    <h3 className="font-semibold mb-2">Məhsul haqqında</h3>
                                    <p className="text-gray-600 text-sm leading-relaxed">{selectedProduct.desc}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => sendWhatsApp(selectedProduct)} className="bg-green-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                                        <i data-lucide="send"></i> Sifariş et
                                    </button>
                                    <button onClick={() => addToCart(selectedProduct)} className="bg-gray-100 text-gray-800 py-4 rounded-2xl font-bold">
                                        Səbətə at
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'cart' && (
                        <div className="p-6 pb-32">
                            <h2 className="text-2xl font-bold mb-6">Səbətim</h2>
                            {cart.length === 0 ? (
                                <div className="text-center py-20 text-gray-400">Səbət boşdur</div>
                            ) : (
                                <div className="space-y-4">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-gray-50 p-3 rounded-2xl">
                                            <img src={item.images[0]} className="w-16 h-16 rounded-xl object-cover" />
                                            <div className="flex-1">
                                                <h4 className="font-semibold text-sm">{item.name}</h4>
                                                <p className="text-green-600 font-bold text-xs">{item.price} AZN</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => setCart(cart.map(c => c.id === item.id ? {...c, qty: Math.max(1, c.qty-1)} : c))} className="w-8 h-8 bg-white rounded-full shadow flex items-center justify-center">-</button>
                                                <span className="font-bold">{item.qty}</span>
                                                <button onClick={() => setCart(cart.map(c => c.id === item.id ? {...c, qty: c.qty+1} : c))} className="w-8 h-8 bg-white rounded-full shadow flex items-center justify-center">+</button>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mt-8 border-t pt-4">
                                        <div className="flex justify-between text-xl font-bold">
                                            <span>Cəmi:</span>
                                            <span>{cart.reduce((a, b) => a + (b.price * b.qty), 0)} AZN</span>
                                        </div>
                                        <button onClick={() => {
                                            const summary = cart.map(i => `${i.name} (${i.qty} ədəd)`).join(', ');
                                            alert(`Sifariş qəbul olundu: ${summary}`);
                                        }} className="w-full bg-green-600 text-white py-4 rounded-2xl font-bold mt-6">Sifarişi tamamla</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {view === 'about' && (
                        <div className="p-6">
                            <div className="bg-green-600 p-8 rounded-[32px] text-white mb-8 premium-shadow">
                                <h1 className="text-3xl font-bold mb-4 uppercase">Senlife nədir?</h1>
                                <p className="text-lg opacity-90 leading-relaxed font-semibold">
                                    Salam! Senlife səmimi duyğuların və premium əl işlərinin birləşdiyi xüsusi bir məkandır. Biz sizin üçün ən zərif hədiyyələri və unikal məhsulları bir araya gətiririk.
                                </p>
                            </div>
                            <div className="space-y-4 font-bold text-gray-800">
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="phone" className="text-green-600"></i>
                                    <span>077 352 66 65</span>
                                </div>
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="instagram" className="text-green-600"></i>
                                    <span>senlife.az</span>
                                </div>
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="mail" className="text-green-600"></i>
                                    <span>senzgroups@gmail.com</span>
                                </div>
                            </div>
                        </div>
                    )}

                    <BottomNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Re-init lucide icons on updates
        setInterval(() => lucide.createIcons(), 500);
    </script>
</body>
</html>

            if (view === 'admin') {
                return (
                    <div className="p-6 pb-24">
                        <div className="flex items-center gap-4 mb-6">
                            <button onClick={() => setView('home')} className="p-2 bg-green-100 rounded-full"><i data-lucide="arrow-left" className="text-green-700"></i></button>
                            <h2 className="text-xl font-bold">Admin Panel</h2>
                        </div>
                        <form onSubmit={(e) => {
                            e.preventDefault();
                            const newP = {
                                id: Date.now(),
                                name: e.target.name.value,
                                price: e.target.price.value,
                                code: e.target.code.value,
                                category: e.target.cat.value,
                                desc: e.target.desc.value,
                                images: [e.target.img.value] // Mobil sadəliyi üçün URL və ya base64
                            };
                            setProducts([newP, ...products]);
                            alert("Məhsul əlavə edildi!");
                            setView('home');
                        }} className="space-y-4">
                            <input name="name" placeholder="Məhsul adı" className="w-full p-3 border rounded-xl" required />
                            <input name="price" placeholder="Qiyməti" className="w-full p-3 border rounded-xl" required />
                            <input name="code" placeholder="Kodu" className="w-full p-3 border rounded-xl" required />
                            <select name="cat" className="w-full p-3 border rounded-xl">
                                {categories.map(c => <option key={c.name}>{c.name}</option>)}
                            </select>
                            <textarea name="desc" placeholder="Təsviri" className="w-full p-3 border rounded-xl"></textarea>
                            <input name="img" placeholder="Şəkil URL (və ya Base64)" className="w-full p-3 border rounded-xl" />
                            <button type="submit" className="w-full bg-green-600 text-white p-4 rounded-xl font-bold">Məhsulu Yerləşdir</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen">
                    <Header />
                    
                    {view === 'home' && (
                        <div className="p-4 pb-24">
                            {/* Banners */}
                            <div className="flex gap-3 overflow-x-auto hide-scrollbar mb-8">
                                {banners.map((b, i) => (
                                    <div key={i} className="min-w-[280px] h-40 bg-green-600 rounded-card p-6 relative overflow-hidden flex-shrink-0 premium-shadow">
                                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-white/10 to-transparent"></div>
                                        <h3 className="absolute bottom-4 left-4 text-white font-bold text-lg">{b}</h3>
                                    </div>
                                ))}
                            </div>

                            {/* New Products */}
                            <h2 className="text-xl font-bold mb-4 px-2">Yeni məhsullar</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())).map(p => (
                                    <div key={p.id} className="bg-white rounded-card p-2 premium-shadow border border-gray-50">
                                        <div onClick={() => { setSelectedProduct(p); setView('product-detail'); }} className="h-40 bg-gray-100 rounded-2xl mb-3 overflow-hidden">
                                            <img src={p.images[0] || 'https://via.placeholder.com/150'} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="text-sm font-semibold truncate">{p.name}</h3>
                                        <p className="text-green-600 font-bold mb-3">{p.price} AZN</p>
                                        <div className="flex flex-col gap-2">
                                            <button onClick={() => sendWhatsApp(p)} className="bg-green-600 text-white text-[10px] py-2 rounded-lg font-bold flex items-center justify-center gap-1">
                                                <i data-lucide="send" className="w-3 h-3"></i> Sifariş
                                            </button>
                                            <button onClick={() => addToCart(p)} className="bg-gray-100 text-gray-800 text-[10px] py-2 rounded-lg font-bold">
                                                Səbətə at
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'categories' && (
                        <div className="p-6 grid grid-cols-3 gap-6 pb-24">
                            {categories.map(c => (
                                <div key={c.id} onClick={() => { setSelectedCategory(c.name); setView('category-items'); }} className="flex flex-col items-center gap-2">
                                    <div className="w-16 h-16 bg-green-50 rounded-2xl flex items-center justify-center text-green-600">
                                        <i data-lucide={c.icon.toLowerCase()}></i>
                                    </div>
                                    <span className="text-[10px] text-center font-medium">{c.name}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'category-items' && (
                         <div className="p-4 pb-24">
                            <div className="flex items-center gap-4 mb-6">
                                <button onClick={() => setView('categories')} className="p-2 bg-gray-100 rounded-full"><i data-lucide="arrow-left"></i></button>
                                <h2 className="text-xl font-bold">{selectedCategory}</h2>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                {products.filter(p => p.category === selectedCategory).map(p => (
                                     <div key={p.id} className="bg-white rounded-card p-2 premium-shadow border border-gray-50">
                                        <div onClick={() => { setSelectedProduct(p); setView('product-detail'); }} className="h-40 bg-gray-100 rounded-2xl mb-3 overflow-hidden">
                                            <img src={p.images[0] || 'https://via.placeholder.com/150'} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="text-sm font-semibold truncate">{p.name}</h3>
                                        <p className="text-green-600 font-bold mb-3">{p.price} AZN</p>
                                        <button onClick={() => sendWhatsApp(p)} className="w-full bg-green-600 text-white text-[12px] py-2 rounded-lg font-bold">Sifariş et</button>
                                    </div>
                                ))}
                            </div>
                         </div>
                    )}

                    {view === 'product-detail' && selectedProduct && (
                        <div className="pb-24">
                            <div className="relative h-96 bg-gray-100">
                                <img src={selectedProduct.images[0]} className="w-full h-full object-cover" />
                                <div className="absolute top-4 left-4 right-4 flex justify-between">
                                    <button onClick={() => setView('home')} className="p-3 bg-white/80 backdrop-blur rounded-full shadow-lg"><i data-lucide="arrow-left"></i></button>
                                    <button onClick={() => { navigator.share({title: 'Senlife', url: window.location.href}) }} className="p-3 bg-white/80 backdrop-blur rounded-full shadow-lg"><i data-lucide="share-2"></i></button>
                                </div>
                            </div>
                            <div className="p-6 bg-white -mt-8 rounded-t-[40px] relative z-10">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">{selectedProduct.name}</h1>
                                        <p className="text-gray-400 text-sm">Kod: {selectedProduct.code} | {selectedProduct.category}</p>
                                    </div>
                                    <div className="text-2xl font-bold text-green-600">{selectedProduct.price} AZN</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-2xl mb-8">
                                    <h3 className="font-semibold mb-2">Məhsul haqqında</h3>
                                    <p className="text-gray-600 text-sm leading-relaxed">{selectedProduct.desc}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => sendWhatsApp(selectedProduct)} className="bg-green-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                                        <i data-lucide="send"></i> Sifariş et
                                    </button>
                                    <button onClick={() => addToCart(selectedProduct)} className="bg-gray-100 text-gray-800 py-4 rounded-2xl font-bold">
                                        Səbətə at
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'cart' && (
                        <div className="p-6 pb-32">
                            <h2 className="text-2xl font-bold mb-6">Səbətim</h2>
                            {cart.length === 0 ? (
                                <div className="text-center py-20 text-gray-400">Səbət boşdur</div>
                            ) : (
                                <div className="space-y-4">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-gray-50 p-3 rounded-2xl">
                                            <img src={item.images[0]} className="w-16 h-16 rounded-xl object-cover" />
                                            <div className="flex-1">
                                                <h4 className="font-semibold text-sm">{item.name}</h4>
                                                <p className="text-green-600 font-bold text-xs">{item.price} AZN</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => setCart(cart.map(c => c.id === item.id ? {...c, qty: Math.max(1, c.qty-1)} : c))} className="w-8 h-8 bg-white rounded-full shadow flex items-center justify-center">-</button>
                                                <span className="font-bold">{item.qty}</span>
                                                <button onClick={() => setCart(cart.map(c => c.id === item.id ? {...c, qty: c.qty+1} : c))} className="w-8 h-8 bg-white rounded-full shadow flex items-center justify-center">+</button>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mt-8 border-t pt-4">
                                        <div className="flex justify-between text-xl font-bold">
                                            <span>Cəmi:</span>
                                            <span>{cart.reduce((a, b) => a + (b.price * b.qty), 0)} AZN</span>
                                        </div>
                                        <button onClick={() => {
                                            const summary = cart.map(i => `${i.name} (${i.qty} ədəd)`).join(', ');
                                            alert(`Sifariş qəbul olundu: ${summary}`);
                                        }} className="w-full bg-green-600 text-white py-4 rounded-2xl font-bold mt-6">Sifarişi tamamla</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {view === 'about' && (
                        <div className="p-6">
                            <div className="bg-green-600 p-8 rounded-[32px] text-white mb-8 premium-shadow">
                                <h1 className="text-3xl font-bold mb-4 uppercase">Senlife nədir?</h1>
                                <p className="text-lg opacity-90 leading-relaxed font-semibold">
                                    Salam! Senlife səmimi duyğuların və premium əl işlərinin birləşdiyi xüsusi bir məkandır. Biz sizin üçün ən zərif hədiyyələri və unikal məhsulları bir araya gətiririk.
                                </p>
                            </div>
                            <div className="space-y-4 font-bold text-gray-800">
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="phone" className="text-green-600"></i>
                                    <span>077 352 66 65</span>
                                </div>
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="instagram" className="text-green-600"></i>
                                    <span>senlife.az</span>
                                </div>
                                <div className="flex items-center gap-4 p-4 border-2 border-green-100 rounded-2xl">
                                    <i data-lucide="mail" className="text-green-600"></i>
                                    <span>senzgroups@gmail.com</span>
                                </div>
                            </div>
                        </div>
                    )}

                    <BottomNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Re-init lucide icons on updates
        setInterval(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
