<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Senlife Marketplace</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>
body { margin:0; font-family:sans-serif; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/javascript">
const { useState, useEffect } = React;

function App(){

const [products,setProducts]=useState([]);
const [cart,setCart]=useState([]);
const [page,setPage]=useState("home");
const [admin,setAdmin]=useState(false);
const [password,setPassword]=useState("");

useEffect(()=>{
  setProducts(JSON.parse(localStorage.getItem("products")||"[]"));
  setCart(JSON.parse(localStorage.getItem("cart")||"[]"));
},[]);

const saveProducts=(data)=>{
  setProducts(data);
  localStorage.setItem("products",JSON.stringify(data));
};

const saveCart=(data)=>{
  setCart(data);
  localStorage.setItem("cart",JSON.stringify(data));
};

const addProduct=(p)=>{
  const newData=[...products,{...p,id:Date.now()}];
  saveProducts(newData);
};

const addToCart=(p)=>{
  const newCart=[...cart,p];
  saveCart(newCart);
};

const removeCart=(i)=>{
  const newCart=cart.filter((_,index)=>index!==i);
  saveCart(newCart);
};

const total=cart.reduce((a,b)=>a+Number(b.price||0),0);

const order=(p)=>{
  const msg=`Salam, bu məhsulu sifariş etmək istəyirəm:
📦 ${p.name}
💰 ${p.price}
🔢 ${p.code}
📝 ${p.desc}`;
  window.open(`https://wa.me/994773526665?text=${encodeURIComponent(msg)}`);
};

return(
<div className="pb-20">

{/* HEADER */}
<div className="p-3 shadow sticky top-0 bg-white flex gap-2 z-50">
<input placeholder="Axtar..." className="flex-1 border p-2 rounded-xl"/>
<button onClick={()=>setAdmin(true)}>≡</button>
</div>

{/* ADMIN LOGIN */}
{admin && (
<div className="fixed inset-0 bg-black/50 flex items-center justify-center">
<div className="bg-white p-4 rounded-xl w-80">

{password!=="20152021Sn/_/" ? (
<>
<input type="password" placeholder="Şifrə"
className="border p-2 w-full mb-2"
onChange={(e)=>setPassword(e.target.value)}/>
<button className="bg-green-500 text-white p-2 w-full"
onClick={()=>{}}>
Daxil ol
</button>
</>
):(
<AdminPanel addProduct={addProduct}/>
)}

</div>
</div>
)}

{/* PAGES */}
{page==="home" && (
<div className="p-3 grid grid-cols-2 gap-3">
{products.map(p=>(
<div key={p.id} className="shadow rounded-xl p-2">
<img src={p.image} className="rounded-xl"/>
<h3>{p.name}</h3>
<p>{p.price}₼</p>

<div className="flex gap-2">
<button onClick={()=>order(p)}>📩</button>
<button onClick={()=>addToCart(p)}>🛒</button>
</div>

</div>
))}
</div>
)}

{page==="cart" && (
<div className="p-4">
{cart.map((c,i)=>(
<div key={i} className="flex justify-between">
<span>{c.name}</span>
<button onClick={()=>removeCart(i)}>❌</button>
</div>
))}
<h2 className="mt-4 font-bold">Ümumi: {total}₼</h2>
</div>
)}

{page==="about" && (
<div className="p-4">
<div className="bg-green-500 text-white p-4 rounded-xl font-bold">
Senlife — premium marketplace platformudur 💚
</div>

<p>WhatsApp: 0773526665</p>
<p>Instagram: senlife.az</p>
<p>Email: senzgroups@gmail.com</p>
</div>
)}

{/* NAVBAR */}
<div className="fixed bottom-0 w-full bg-white shadow flex justify-around p-3">
<button onClick={()=>setPage("home")}>🏠</button>
<button onClick={()=>setPage("cart")}>🛒</button>
<button onClick={()=>setPage("about")}>ℹ️</button>
</div>

</div>
);
}

function AdminPanel({addProduct}){
const [p,setP]=useState({});

return(
<div className="flex flex-col gap-2">
<input placeholder="Ad" onChange={e=>setP({...p,name:e.target.value})}/>
<input placeholder="Qiymət" onChange={e=>setP({...p,price:e.target.value})}/>
<input placeholder="Kod" onChange={e=>setP({...p,code:e.target.value})}/>
<input placeholder="Kateqoriya" onChange={e=>setP({...p,category:e.target.value})}/>
<textarea placeholder="Təsvir" onChange={e=>setP({...p,desc:e.target.value})}/>

<input type="file" onChange={(e)=>{
const reader=new FileReader();
reader.onload=()=>setP({...p,image:reader.result});
reader.readAsDataURL(e.target.files[0]);
}}/>

<button className="bg-green-500 text-white p-2 rounded"
onClick={()=>addProduct(p)}>
Əlavə et
</button>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
